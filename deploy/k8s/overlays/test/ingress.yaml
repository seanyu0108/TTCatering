apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scan-order
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app-test.example.com
        - api-test.example.com
      secretName: scan-order-test-tls
  rules:
    - host: app-test.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scan-order-web
                port:
                  name: http
    - host: api-test.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scan-order-api
                port:
                  name: http

