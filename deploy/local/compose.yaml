name: scan-order-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scan_order_test
      POSTGRES_USER: scan_order
      POSTGRES_PASSWORD: scan_order_test
    ports:
      - "5432:5432"
    volumes:
      - scan-order-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scan_order -d scan_order_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scan-order-postgres:
