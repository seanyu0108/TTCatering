name: ttcatering-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ttcatering
      POSTGRES_USER: manage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
    ports:
      - "5432:5432"
    volumes:
      - ttcatering-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manage -d ttcatering"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ttcatering-postgres:
